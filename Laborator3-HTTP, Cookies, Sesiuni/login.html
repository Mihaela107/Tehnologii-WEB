<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section>
            <h1>Autentificare</h1>
            <p>Folosește unul dintre utilizatorii de test sau creează un cont nou.</p>
            <nav>
                <a href="index.html">Acasă</a>
                <a href="register.html">Înregistrare</a>
            </nav>
        </section>

        <section>
            <div class="alert-info">
                <strong>Utilizatori de test:</strong><br>
                admin / password<br>
                student / student123
            </div>

            <div id="messageBox"></div>

            <form id="loginForm">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div>
                    <label for="password">Parolă</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div>
                    <label>
                        <input type="checkbox" id="rememberMe" style="width:auto; margin-right:8px;">
                        Ține-mă minte
                    </label>
                </div>

                <button type="submit">Conectează-te</button>
            </form>

            <p class="small">Nu ai cont? <a href="register.html">Creează unul aici</a>.</p>
        </section>
    </div>

    <script src="js/cookies.js"></script>
    <script src="js/storage.js"></script>
    <script>
        const defaultUsers = [
            { id: 1, username: 'admin', password: 'password', email: 'admin@example.com' },
            { id: 2, username: 'student', password: 'student123', email: 'student@example.com' }
        ];

        function applyThemeAndPreferences() {
            const theme = CookieManager.get('theme') || 'light';
            document.body.classList.remove('light', 'dark');
            document.body.classList.add(theme);
            document.body.style.fontSize = (StorageManager.getLocal('fontSize') || '16') + 'px';
        }

        function ensureDefaultUsers() {
            const users = StorageManager.getLocal('users');
            if (!users || !Array.isArray(users) || users.length === 0) {
                StorageManager.setLocal('users', defaultUsers);
            }
        }

        function showMessage(text, type = 'alert-error') {
            document.getElementById('messageBox').innerHTML = `<div class="${type}">${text}</div>`;
        }

        function generateSessionId() {
            return 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        }

        function loadRememberedUsername() {
            const rememberedUsername = StorageManager.getLocal('rememberedUsername');
            if (rememberedUsername) {
                document.getElementById('username').value = rememberedUsername;
                document.getElementById('rememberMe').checked = true;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            const users = StorageManager.getLocal('users') || [];
            const user = users.find(item => item.username === username && item.password === password);

            if (!user) {
                showMessage('Username sau parolă incorecte.');
                return;
            }

            if (rememberMe) {
                StorageManager.setLocal('rememberedUsername', username);
            } else {
                StorageManager.removeLocal('rememberedUsername');
            }

            const sessionData = {
                userId: user.id,
                username: user.username,
                email: user.email,
                loginTime: new Date().toISOString(),
                sessionId: generateSessionId()
            };

            StorageManager.setSession('session', sessionData);
            showMessage('Autentificare reușită. Redirecționare către dashboard...', 'alert-success');

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        });

        applyThemeAndPreferences();
        ensureDefaultUsers();
        loadRememberedUsername();
    </script>
</body>
</html>
